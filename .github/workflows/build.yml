name: Build

on:
  push:
    branches: [master, 'claude/**']
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The parts that don't need Windows: protocol layout, input checks, and EDIDs checked by edid-decode
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Install edid-decode
        run: sudo apt-get update && sudo apt-get install -y edid-decode

      - name: Protocol header builds as C and C++
        run: |
          printf '#include "luzvda/luzvda-ioctl.h"\nint main(void) { return 0; }\n' > "$RUNNER_TEMP/ioctl.c"
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude "$RUNNER_TEMP/ioctl.c" -o "$RUNNER_TEMP/ioctl_c"
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -x c++ "$RUNNER_TEMP/ioctl.c" -o "$RUNNER_TEMP/ioctl_cpp"

      # The frame consumer is Windows-only; MinGW checks it builds as Apollo would include it
      - name: Frame helpers build for Windows (MinGW, C++17 and C++23)
        run: |
          sudo apt-get install -y g++-mingw-w64-x86-64-posix
          printf '#include "luzvda/luzvda-frames.h"\nint main() { luzvda::frames::consumer_t c; return c.header() ? 1 : 0; }\n' > "$RUNNER_TEMP/frames.cpp"
          for std in c++17 c++23; do
            x86_64-w64-mingw32-g++-posix -std=$std -Wall -Wextra -Werror -Iinclude -fsyntax-only "$RUNNER_TEMP/frames.cpp"
          done
          # As the driver build has it: no STATUS_* definitions from windows.h
          x86_64-w64-mingw32-g++-posix -std=c++17 -Wall -Wextra -Werror -DWIN32_NO_STATUS -Iinclude -Isrc -fsyntax-only src/driver/FrameChannel.cpp

      - name: Unit tests
        run: |
          for t in validate edid_builder frame_channel frame_code; do
            g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude -Isrc -Itools "tests/${t}_test.cpp" -o "$RUNNER_TEMP/$t"
          done
          "$RUNNER_TEMP/validate"
          "$RUNNER_TEMP/frame_channel"
          "$RUNNER_TEMP/frame_code"
          mkdir -p "$RUNNER_TEMP/edids"
          "$RUNNER_TEMP/edid_builder" "$RUNNER_TEMP/edids"

      - name: EDIDs conform (edid-decode --check)
        run: |
          for f in "$RUNNER_TEMP"/edids/*.bin; do
            echo "== $(basename "$f")"
            edid-decode --check "$f" | sed -n '/^Warnings:/,$p'
          done

  build:
    needs: tests
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      # A tag vX.Y.Z builds X.Y.Z.<run number>; anything else 0.0.0.<run number>
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = '0.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          $p = $v.Split('.')
          if ($p.Count -ne 3 -or ($p | Where-Object { $_ -notmatch '^\d+$' })) { throw "Tags must be vX.Y.Z, got $env:GITHUB_REF_NAME" }
          "major=$($p[0])" >> $env:GITHUB_OUTPUT
          "minor=$($p[1])" >> $env:GITHUB_OUTPUT
          "patch=$($p[2])" >> $env:GITHUB_OUTPUT
          "build=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
          "full=$v.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT

      - name: Restore the WDK
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      # MSBuild isn't on the PATH of a plain shell; vswhere, installed with Visual Studio, finds it
      - name: Build the driver
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild LuzVDA.sln -t:rebuild -noLogo -clp:Verbosity=m `
            -p:Configuration=Release -p:Platform=x64 -p:TargetVersion=Windows10 `
            -p:LuzVdaVersionMajor=${{ steps.version.outputs.major }} `
            -p:LuzVdaVersionMinor=${{ steps.version.outputs.minor }} `
            -p:LuzVdaVersionPatch=${{ steps.version.outputs.patch }} `
            -p:LuzVdaVersionBuild=${{ steps.version.outputs.build }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build luzvda-ctl
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -no_logo || exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /Iinclude tools\luzvda-ctl\luzvda-ctl.cpp /Fe:luzvda-ctl.exe setupapi.lib newdev.lib dxgi.lib d3d11.lib ole32.lib user32.lib advapi32.lib || exit /b 1

      # Unsigned: the owner signs with their own key on their own PC (scripts/sign-package.ps1)
      - name: Package
        shell: pwsh
        run: |
          # The solution builds into x64\Release, and the driver package into its LuzVDA folder
          $cat = Get-ChildItem -Recurse -Path x64\Release -Filter luzvda.cat | Select-Object -First 1
          if (-not $cat) { Get-ChildItem -Recurse x64 | Select-Object FullName; throw 'No luzvda.cat in the build output' }
          $pkg = $cat.Directory.FullName
          Get-ChildItem $pkg | Format-Table Name, Length

          $driverVer = (Select-String -Path "$pkg\LuzVDA.inf" -Pattern '^DriverVer\s*=').Line
          Write-Host $driverVer
          if ($driverVer -notmatch [regex]::Escape('${{ steps.version.outputs.full }}')) { throw "DriverVer isn't ${{ steps.version.outputs.full }}" }

          $name = 'LuzVDA-${{ steps.version.outputs.full }}-unsigned'
          $out = "dist\$name"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$pkg\LuzVDA.inf", "$pkg\LuzVDA.dll", "$pkg\luzvda.cat" $out
          Copy-Item luzvda-ctl.exe, include\luzvda\luzvda-ioctl.h, include\luzvda\luzvda-frames.h, LICENSE, NOTICE.md $out
          Copy-Item scripts\*.ps1 $out
          Compress-Archive -Path "$out\*" -DestinationPath "dist\$name.zip"
          Get-FileHash "dist\$name.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $name.zip" } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          # Not the zip's own name: GitHub wraps artifacts in a zip of the artifact's name
          name: LuzVDA-${{ steps.version.outputs.full }}-ci
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
